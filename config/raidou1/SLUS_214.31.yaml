name: "Shin Megami Tensei: Devil Summoner (USA) (SLUS_214.31)"
sha1: a005ff18213eb72017119c7d666312507ad3b5ea
options:
  basename: SLUS_214.31
  platform: ps2
  compiler: EEGCC
  base_path: ../..
  target_path: orig/raidou1/SLUS_214.31
  elf_path: build/raidou1/SLUS_214.31.elf
  asset_path: assets/raidou1
  asm_path: asm/raidou1
  src_path: src/raidou1
  build_path: build/raidou1
  ld_script_path: build/raidou1/SLUS_214.31.ld
  ld_dependencies: True
  symbol_addrs_path:
    - config/raidou1/symbol_addrs.txt
  reloc_addrs_path:
    - config/raidou1/reloc_addrs.txt
  undefined_funcs_auto_path: config/raidou1/undefined_funcs_auto.txt
  undefined_syms_auto_path: config/raidou1/undefined_syms_auto.txt

  gp_value: 0x00471770
  # The original assembler (ee-as 2.9-ee) is used for C and INCLUDE_ASM alike,
  # so keep register names numeric: old gas predates some o32 aliases.
  mips_abi_gpr: numeric
  mips_abi_float_regs: numeric
  named_regs_for_c_funcs: False
  add_set_gp_64: False
  use_legacy_include_asm: True
  asm_inc_header: ""
  generate_asm_macros_files: False
  find_file_boundaries: True
  disassemble_all: True
  make_full_disasm_for_code: True
  disasm_unknown: True
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  section_order: [".text", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]
  o_as_suffix: True
  ld_bss_is_noload: True
  emit_subalign: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_generate_symbol_per_data_segment: True

segments:
  # ELF file header + 3 program headers at 0x34, then zeros to the first loaded
  # page; not loaded. The retail ELF keeps its section headers, so the file also
  # has a trailer segment (below) that no program header covers.
  - [0x0, bin, elf_header]

  - name: main
    type: code
    align: 1
    start: 0x1000
    vram: 0x100000
    # vram_end = vram + (rom_end - rom_start) + bss_size must land on .vubss
    # (0x0050F970), the end of .bss and of PT_LOAD[2]'s memsz.
    bss_size: 0xA039C
    subsegments:
      # No TU recovery yet: .text is one asm unit. A C unit would build its .lit4
      # with ee-as (tools/eeas_compat.py), which merges repeated constants across the whole unit;
      # retail has one pool per original object, so C waits for TU boundaries.
      - [0x1000, asm, hand/crt0]  # 8 pad bytes, _start (0x100008), 2 stubs; ends where the game code begins, as in SMT3
      - [0x11D8, asm, code_001001D8]
      # .vutext (0x0039EA00, 0xE7B0): VU1 microcode, byte-identical to SMT3's.
      # The 4 zero bytes of .text tail padding before it fall in the unit above.
      - [0x29FA00, textbin, vutext]
      # .ctors + .dtors (both ffffffff 00000000) + .reginfo, then zeros to .data.
      - [0x2AE1B0, databin, ctors_dtors_reginfo]
      - [0x2AE200, data, data]
      - [0x345368, databin, eh_frame]
      # .vudata (0x300) plus the zeros up to .rodata's 16-byte boundary.
      - [0x34536C, databin, vudata]
      - [0x345680, rodata, rodata]
      - [0x36A780, lit4, lit4]
      - [0x36C0CC, lit4, lit4_pad]
      - [0x36C100, sdata, sdata]
      # .sbss and .bss are noload, so they start at the segment's rom end.
      # Retail puts both on 128-byte boundaries (configure.py's align_bss).
      # .vubss is zero-length at the end of .bss and needs no subsegment.
      - { start: 0x3705D4, type: sbss, vram: 0x46F600, name: sbss }
      - { start: 0x3705D4, type: bss, vram: 0x46FB00, name: bss }

  # Starts one byte inside .sdata: its size (0x44D5) is not a multiple of 4 and
  # spimdisasm emits whole words, so the last byte comes from this blob. Then
  # .sdata tail padding, .DVP.ovlytab/.ovlystrtab/.overlay.* (VU overlay tables
  # and microcode copies), .shstrtab and the 28 section headers; none loaded.
  - [0x3705D4, bin, elf_trailer]
  - [0x374E90]
