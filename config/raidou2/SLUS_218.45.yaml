name: "Shin Megami Tensei: Devil Summoner 2 (USA) (SLUS_218.45)"
sha1: bc0d30b35a40324db1f6d43bb652c6ca1dab3629
options:
  basename: SLUS_218.45
  platform: ps2
  compiler: EEGCC
  base_path: ../..
  target_path: orig/raidou2/SLUS_218.45
  elf_path: build/raidou2/SLUS_218.45.elf
  asset_path: assets/raidou2
  asm_path: asm/raidou2
  src_path: src/raidou2
  build_path: build/raidou2
  ld_script_path: build/raidou2/SLUS_218.45.ld
  ld_dependencies: True
  symbol_addrs_path:
    - config/raidou2/symbol_addrs.txt
  reloc_addrs_path:
    - config/raidou2/reloc_addrs.txt
  undefined_funcs_auto_path: config/raidou2/undefined_funcs_auto.txt
  undefined_syms_auto_path: config/raidou2/undefined_syms_auto.txt

  gp_value: 0x004E4170
  # The original assembler (ee-as 2.9-ee) is used for C and INCLUDE_ASM alike,
  # so keep register names numeric: old gas predates some o32 aliases.
  mips_abi_gpr: numeric
  mips_abi_float_regs: numeric
  named_regs_for_c_funcs: False
  add_set_gp_64: False
  use_legacy_include_asm: True
  asm_inc_header: ""
  generate_asm_macros_files: False
  find_file_boundaries: True
  disassemble_all: True
  make_full_disasm_for_code: True
  disasm_unknown: True
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  section_order: [".text", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]
  o_as_suffix: True
  ld_bss_is_noload: True
  emit_subalign: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_generate_symbol_per_data_segment: True

segments:
  # ELF file header + 3 program headers at 0x34, then zeros to the first loaded
  # page; not loaded. The retail ELF keeps its section headers, so the file also
  # has a trailer segment (below) that no program header covers.
  - [0x0, bin, elf_header]

  - name: main
    type: code
    align: 1
    start: 0x1000
    vram: 0x100000
    # vram_end = vram + (rom_end - rom_start) + bss_size must land on .vubss
    # (0x0059E64C), the end of .bss and of PT_LOAD[2]'s memsz.
    bss_size: 0xBA060
    subsegments:
      # .text units come from tools/raidou_tus.py --write (evidence per unit in
      # config/raidou2/tu_evidence.tsv): c units are TUs, asm code_<vram> units are gaps.
      - [0x1000, asm, hand/crt0]  # 8 pad bytes, _start (0x100008), 2 stubs; ends where the game code begins, as in SMT3
      - [0x11D8, asm, code_001001D8]
